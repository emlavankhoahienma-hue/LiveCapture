name: LiveCapture
options:
  bundleIdPrefix: com.livecompose
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "16.0"

targets:
  LiveCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: LiveCapture
    info:
      path: LiveCapture/Info.plist
      properties:
        CFBundleDisplayName: LiveCapture
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "LiveCapture needs camera access for real-time AI composition guidance and photo capture."
        NSPhotoLibraryAddUsageDescription: "LiveCapture needs permission to save captured photos and share cards to your Photo Library."
        NSPhotoLibraryUsageDescription: "LiveCapture needs Photo Library access to save and manage photos."
        NSMotionUsageDescription: "LiveCapture uses motion sensors to track device stability and guide composition."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livecompose.LiveCapture
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1"
